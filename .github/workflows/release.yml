name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser needs the full history to build the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fill the REPLACE_WITH_*_SHA256 placeholders in packaging/ from the
      # release's checksums.txt and push the result back to main. We
      # re-checkout main in a fresh step because the goreleaser step above
      # leaves the working tree on a detached tag HEAD, and `git push`
      # without an explicit ref fails there. The GITHUB_TOKEN push does
      # not re-trigger this workflow.
      - name: Fill packaging checksums
        run: |
          git checkout main
          git pull --ff-only
          bash scripts/fill-checksums.sh dist/checksums.txt "${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain packaging/)" ]; then
            git add packaging/
            git commit -m "chore: fill packaging checksums for ${{ github.ref_name }}"
            git push
          else
            echo "packaging already up to date"
          fi
